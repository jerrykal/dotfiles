id = "herdr-picker"
name = "herdr-picker"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "fzf picker for workspaces, worktrees and zoxide directories"
platforms = ["linux", "macos"]

[[events]]
on = "workspace.focused"
command = ["bash", "herdr-picker.sh", "--record"]

[[actions]]
id = "open"
title = "Pick a workspace, worktree or directory"
contexts = ["global"]
command = ["bash", "herdr-picker.sh", "--open"]

[[panes]]
id = "picker"
title = "Workspaces"
placement = "popup"
command = ["bash", "herdr-picker.sh"]
