onboarding = false
[theme]
name = "rose-pine"

[terminal]
new_cwd = "follow"

[ui]
pane_gaps = false
pane_outer_borders = false
prompt_new_tab_name = false
tab_bar_right = [{ type = "hostname" }]

[ui.sidebar.agents]
row_gap = 0
rows = [
  [
    "state_icon",
    "machine",
    "workspace",
    "tab",
  ],
  [
    "terminal_title_stripped",
  ],
]

[keys]
prefix = "ctrl+space"
detach = "prefix+d"

# Workspace
previous_workspace = "prefix+L"
navigate_workspace_down = "j"
navigate_workspace_up = "k"

# Tabs
previous_tab = "prefix+l"
move_tab_previous = "alt+,"
move_tab_next = "alt+."

# Pane
split_horizontal = "prefix+h"
split_vertical = "prefix+v"
last_pane = "prefix+;"
zoom = "alt+enter"

# smart-splits.nvim: seamless ctrl+h/j/k/l between herdr panes and Neovim splits.
# Plugin is linked from the lazy.nvim clone:
#   herdr plugin link ~/.local/share/nvim/lazy/smart-splits.nvim
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "smart-splits.nvim.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "smart-splits.nvim.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "smart-splits.nvim.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "smart-splits.nvim.right"
description = "navigate right (vim/herdr)"

# prefix+ctrl+h/j/k/l: pass the raw ctrl+h/j/k/l through to the focused pane
# (bypasses the smart-splits bindings above, e.g. for a nested tmux/vim that wants them).
[[keys.command]]
key = "prefix+ctrl+h"
type = "shell"
command = "\"$HERDR_BIN_PATH\" pane send-keys \"$HERDR_ACTIVE_PANE_ID\" ctrl+h"
description = "send ctrl+h to pane"

[[keys.command]]
key = "prefix+ctrl+j"
type = "shell"
command = "\"$HERDR_BIN_PATH\" pane send-keys \"$HERDR_ACTIVE_PANE_ID\" ctrl+j"
description = "send ctrl+j to pane"

[[keys.command]]
key = "prefix+ctrl+k"
type = "shell"
command = "\"$HERDR_BIN_PATH\" pane send-keys \"$HERDR_ACTIVE_PANE_ID\" ctrl+k"
description = "send ctrl+k to pane"

[[keys.command]]
key = "prefix+ctrl+l"
type = "shell"
command = "\"$HERDR_BIN_PATH\" pane send-keys \"$HERDR_ACTIVE_PANE_ID\" ctrl+l"
description = "send ctrl+l to pane"
