theme = "custom"

# Rosé Pine ("main" variant) tuned for full saturation instead of the
# washed-out Shiki-derived built-in. Diff backgrounds blend the palette colour
# over base #191724 (DiffAdd/DiffDelete=20%, DiffText/content=38%).
# git_add=foam, git_change=rose, git_delete=love, git_rename=pine,
# untracked=subtle (rose-pine default groups).
[custom_theme]
base  = "rose-pine"  # inherit Shiki rose-pine for accurate code highlighting
label = "Rosé Pine"

# chrome
background  = "#191724"  # base
panel       = "#191724"  # base
panelAlt    = "#1f1d2e"  # surface
border      = "#56526e"  # highlight-high
accent      = "#c4a7e7"  # iris (Visual / link)
accentMuted = "#6e6a86"  # muted
text        = "#e0def4"  # text
muted       = "#908caa"  # subtle

# diff line backgrounds (DiffAdd / DiffDelete blend 20)
addedBg        = "#333c48"  # foam @20%
removedBg      = "#43293a"  # love @20%
contextBg      = "#191724"
movedAddedBg   = "#1e2a39"  # pine @20%
movedRemovedBg = "#3b344b"  # iris @20%

# intra-line (changed-word) highlights (DiffText-style blend 38)
addedContentBg   = "#4b5d68"  # foam @38%
removedContentBg = "#69384e"  # love @38%
contextContentBg = "#191724"

# gutter signs
addedSignColor   = "#9ccfd8"  # foam
removedSignColor = "#eb6f92"  # love

# line numbers + selection (cursor line is derived: text @20% over the row bg)
lineNumberBg = "#191724"
lineNumberFg = "#6e6a86"  # muted (LineNr)
selectedHunk = "#26233a"  # overlay; selection blends it 75% over the row bg

# summary badges
badgeAdded   = "#9ccfd8"  # foam
badgeRemoved = "#eb6f92"  # love
badgeNeutral = "#908caa"  # subtle

# file status (Diffview group mappings)
fileNew       = "#9ccfd8"  # foam (added)
fileDeleted   = "#eb6f92"  # love
fileRenamed   = "#31748f"  # pine
fileModified  = "#ebbcba"  # rose (change)
fileUntracked = "#908caa"  # subtle

# agent notes
noteBorder          = "#c4a7e7"  # iris
noteBackground      = "#2a2538"  # iris @10%
noteTitleBackground = "#443b55"  # iris @25%
noteTitleText       = "#e0def4"

[custom_theme.syntax_scopes]
"source"                         = "#e0def4"  # text
"keyword"                        = "#31748f"  # pine
"string"                         = "#f6c177"  # gold
"comment"                        = "#6e6a86"  # muted
"punctuation.definition.comment" = "#6e6a86"  # muted
"constant.numeric"               = "#f6c177"  # gold
"entity.name.function"           = "#ebbcba"  # rose
"support.function"               = "#ebbcba"  # rose
"variable.function"              = "#ebbcba"  # rose
"variable.other.property"        = "#9ccfd8"  # foam
"support.variable.property"      = "#9ccfd8"  # foam
"entity.name.type"               = "#9ccfd8"  # foam
"entity.name.class"              = "#9ccfd8"  # foam
"support.type"                   = "#9ccfd8"  # foam
"support.class"                  = "#9ccfd8"  # foam
"variable"                       = "#e0def4"  # text
"keyword.operator"               = "#908caa"  # subtle
"punctuation"                    = "#908caa"  # subtle
