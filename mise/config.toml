[settings]
minimum_release_age_excludes = ["claude", "codex", "herdr"]

[tools]
atuin = "latest"
bat = "latest"
claude = "latest"
codex = "latest"
delta = "latest"
eza = "latest"
fd = "latest"
fzf = "latest"
gh = "latest"
"github:agavra/tuicr" = "latest"
go = "latest"
herdr = "latest"
hunk = "latest"
jq = "latest"
just = "latest"
lazygit = "latest"
neovim = "latest"
node = "lts"
npm = "latest"
"npm:playwright" = "latest"
python = "latest"
ripgrep = "latest"
rust = "latest"
tree-sitter = "latest"
uv = "latest"
worktrunk = "latest"
zoxide = "latest"

[tasks."fish:plugins"]
description = "Install or update fish plugins"
usage = 'flag "--update" help="Upgrade, not just install what is missing"'
# Starting fish installs fisher itself when $fisher_path is missing (conf.d/__init__.fish).
run = """
  fish -c '
    if test -n "$usage_update"; fisher update; exit; end
    set -l want (sort $__fish_config_dir/fish_plugins | string collect)
    set -l have (fisher list | sort | string collect)
    test "$want" = "$have"; or fisher update
  '
"""

[tasks."herdr:plugins"]
description = "Install or update herdr plugins"
usage = 'flag "--update" help="Upgrade, not just install what is missing"'
# herdr has no `plugin update`; re-running install refetches. Linked local
# plugins live in the repo, so they are always current.
run = """
  plugins="$HOME/.dotfiles/herdr/plugins"
  if [ -n "${usage_update:-}" ] || ! herdr plugin list | grep -q smart-splits.nvim; then
    herdr plugin install mrjones2014/smart-splits.nvim -y
  fi
  herdr plugin list | grep -q last-focus || herdr plugin link "$plugins/last-focus"
  herdr plugin list | grep -q herdr-picker || herdr plugin link "$plugins/herdr-picker"
"""

[tasks."nvim:plugins"]
description = "Install or update Neovim plugins"
usage = 'flag "--update" help="Upgrade, not just install what is missing"'
# lazy.nvim clones itself on first start and installs at lazy-lock.json commits.
run = """
  if [ -n "${usage_update:-}" ]; then cmd='+Lazy! sync'; else cmd='+Lazy! install'; fi
  nvim --headless "$cmd" +qa
"""

[tasks."tmux:plugins"]
description = "Install or update tmux plugins"
usage = 'flag "--update" help="Upgrade, not just install what is missing"'
run = """
  tpm="$HOME/.config/tmux/plugins/tpm"
  [ -d "$tpm" ] || git clone https://github.com/tmux-plugins/tpm "$tpm"
  if [ -n "${usage_update:-}" ]; then
    "$tpm/bin/update_plugins" all
  else
    "$tpm/bin/install_plugins"
  fi
"""

[tasks."update:system"]
description = "Update Homebrew packages."
run = """
  command -v brew >/dev/null 2>&1 || { echo "no brew, skipping"; exit 0; }
  brew update && brew upgrade
"""

[tasks."update:tools"]
description = "Update mise, its plugins, managed tools, and uv tools."
run = """
  echo "==> mise"
  # self-update only applies to the standalone installer, not a brew install
  case "$(command -v mise)" in */homebrew/*) ;; *) mise self-update --yes ;; esac
  mise plugins update
  mise upgrade

  echo "==> uv"
  command -v uv >/dev/null 2>&1 && uv tool upgrade --all
"""

[tasks."update:plugins"]
description = "Update Neovim, fish, tmux, and herdr plugins."
run = [
  { task = "nvim:plugins --update" },
  { task = "fish:plugins --update" },
  { task = "tmux:plugins --update" },
  { task = "herdr:plugins --update" },
]

[tasks."update:skills"]
description = "Update agent skills tracked in ~/.local/state/skills/.skill-lock.json."
dir = "~"
run = "npx -y skills update --global --yes"

[tasks."update:dotfiles"]
description = "Fast-forward ~/.dotfiles when on main, then converge it."
dir = "~/.dotfiles"
run = """
  if [ "$(git symbolic-ref --short HEAD)" = "main" ]; then
    git pull --ff-only origin main
  else
    echo "not on main, skipping pull"
  fi
  mise bootstrap --yes
"""

[tasks."update:all"]
description = "Update system packages, tools, plugins, skills, and ~/.dotfiles."
run = [
  { task = "update:system" },
  { task = "update:tools" },
  { task = "update:plugins" },
  { task = "update:skills" },
  { task = "update:dotfiles" },
]

[tasks.clean]
description = "Reclaim disk: prune brew, mise, uv, and Go caches and unused Neovim plugins."
run = """
  echo "==> brew"
  if command -v brew >/dev/null 2>&1; then brew cleanup --prune=all; fi

  echo "==> mise"
  mise prune --yes
  mise cache clear

  echo "==> uv"
  if command -v uv >/dev/null 2>&1; then uv cache prune; fi

  echo "==> neovim"
  nvim --headless '+Lazy! clean' +qa

  echo "==> go"
  if command -v go >/dev/null 2>&1; then go clean -cache; fi
"""

[tasks."setup:git"]
description = "Write git user.name and user.email to ~/.gitconfig.local."
usage = '''
arg "[name]" help="Git user.name (prompted if omitted)"
arg "[email]" help="Git user.email (prompted if omitted)"
'''
run = """
  name="${usage_name:-}"
  email="${usage_email:-}"
  cfg="$HOME/.gitconfig.local"
  cur_name="$(git config --file "$cfg" user.name 2>/dev/null || true)"
  cur_email="$(git config --file "$cfg" user.email 2>/dev/null || true)"

  if [ -z "$name" ]; then
    printf 'git user.name [%s]: ' "$cur_name"; read -r name
    name="${name:-$cur_name}"
  fi
  if [ -z "$email" ]; then
    printf 'git user.email [%s]: ' "$cur_email"; read -r email
    email="${email:-$cur_email}"
  fi
  [ -n "$name" ] && [ -n "$email" ] || { echo "name and email are required" >&2; exit 1; }

  git config --file "$cfg" user.name "$name"
  git config --file "$cfg" user.email "$email"
  echo "wrote $cfg:"
  git config --file "$cfg" --list
"""
