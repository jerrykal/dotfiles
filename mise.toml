[dotfiles]
# mise global config + tools
"~/.config/mise/config.toml" = "mise/config.toml"

# Whole-directory symlinks. Runtime files these tools write next to their
# config (fisher/, fish_variables, tmux/plugins/, hunk state.json, btop.log,
# nvim/plugin/) land in the repo checkout and are gitignored.
"~/.config/atuin" = "atuin"
"~/.config/bat" = "bat"
"~/.config/btop" = "btop"
"~/.config/eza" = "eza"
"~/.config/fish" = "fish"
"~/.config/gh-dash" = "gh-dash"
"~/.config/git" = "git"
"~/.config/hunk" = "hunk"
"~/.config/lazygit" = "lazygit"
"~/.config/nvim" = "nvim"
"~/.config/ruff" = "ruff"
"~/.config/tmux" = "tmux"
"~/.config/tuicr" = "tuicr"

# Per-file links into directories that also hold unmanaged/runtime files.
# manifest = "git" links only tracked files.
"~" = { source = "shell", mode = "symlink-each", manifest = "git" }
"~/.local/bin" = { source = "bin", mode = "symlink-each", manifest = "git" }
"~/.claude" = { source = "claude", mode = "symlink-each", manifest = "git" }
"~/.config/herdr" = { source = "herdr", mode = "symlink-each", manifest = "git" }
"~/.config/worktrunk" = { source = "worktrunk", mode = "symlink-each", manifest = "git" }

# Go tools under tools/: each links a self-building shim that compiles the
# module beside it into $XDG_CACHE_HOME on first run and whenever sources change.
"~/.local/bin/pf" = "tools/pf/pf"

# Agent skills
"~/.agents/skills" = "skills/agents"
"~/.claude/skills" = "skills/claude"
"~/.local/state/skills/.skill-lock.json" = "skills/.skill-lock.json"

# System packages not managed by mise tools
[bootstrap.packages]
"brew:bash" = "latest"
"brew:btop" = "latest"
"brew:fish" = "latest"
"brew:nvtop" = "latest"
"brew:rsync" = "latest"
"brew:tmux" = "latest"
"brew:wget" = "latest"
"brew:zsh" = "latest"

# Runs as the last phase of `mise bootstrap`; must be safe to repeat.
# The *:plugins tasks live in mise/config.toml so `update:plugins` can reuse
# them; global tasks merge into this config's task list.
[tasks.bootstrap]
description = "Post-bootstrap setup that needs installed tools."
depends = ["fish:plugins", "gh:extensions", "herdr:plugins", "nvim:plugins", "tmux:plugins"]
