# --- General ---
unbind C-b
set-option -g prefix C-Space
bind C-Space send-prefix

set -g mouse on
set -g focus-events on
set -g history-limit 200000

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Closing a session switches to a detached one if any is left, else detaches
set -g detach-on-destroy no-detached

set -g main-pane-height 75%
set -g main-pane-width 70%

# `notify` rings the bell to flag a window; don't ring it in the one being watched
set -g bell-action other

# --- Terminal ---
# Matched on * because ${TERM} is expanded once, at server start
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB:usstyle:hyperlinks:sync"

set -g extended-keys on
set -g extended-keys-format csi-u

# Passthrough lets e.g. snacks.image reach the outer terminal, even from
# panes that aren't on screen
set -g set-clipboard on
set -g allow-passthrough all

set -g cursor-style blinking-block

set -g set-titles on
set -g set-titles-string "#h: #S"

# --- Copy mode: keys ---
setw -g mode-keys vi
bind P paste-buffer
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection

# Toggle block mode, starting a selection only if none is active.
# selection_present would read 0 for a one-character selection.
bind -T copy-mode-vi C-v {
  send -X rectangle-toggle
  if -F "#{!=:#{selection_active},1}" { send -X begin-selection }
}

# Y yanks with a scrollback snapshot path, row range and pane id prepended,
# so an agent can read the surrounding output (see bin/tmux-ref). No selection
# takes the cursor line. `pipe`, since copy-pipe would overwrite tmux-ref's buffer.
bind -T copy-mode-vi Y {
  if -F "#{!=:#{selection_active},1}" { send -X select-line }
  send -X pipe "~/.local/bin/tmux-ref yank '#{pane_id}' '#{selection_start_y}' '#{selection_end_y}'"
}

# Incremental search
bind -T copy-mode-vi / command-prompt -i -p "/" "send-keys -X search-forward-incremental \"%%%\""
bind -T copy-mode-vi ? command-prompt -i -p "?" "send-keys -X search-backward-incremental \"%%%\""

# --- Copy mode: mouse ---
# Scroll one line per wheel tick
bind -T copy-mode-vi WheelUpPane send -N 1 -X scroll-up
bind -T copy-mode-vi WheelDownPane send -N 1 -X scroll-down
bind -T copy-mode WheelUpPane send -N 1 -X scroll-up
bind -T copy-mode WheelDownPane send -N 1 -X scroll-down

# Stay in copy-mode after a left drag copies
bind -T copy-mode-vi MouseDrag1Pane select-pane \; send -X rectangle-off \; send -X begin-selection
bind -T copy-mode MouseDrag1Pane select-pane \; send -X rectangle-off \; send -X begin-selection
unbind -T copy-mode-vi MouseDragEnd1Pane
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection
unbind -T copy-mode MouseDragEnd1Pane
bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-selection

# A left click leaves copy-mode. Bound on release, since a press can't yet
# tell a click from a drag.
bind -T copy-mode-vi MouseUp1Pane send -X cancel
bind -T copy-mode MouseUp1Pane send -X cancel

# Right drag selects without copying, leaving it for y/Y, and works over apps
# that take the mouse (nvim, Claude Code). The context menu moves to
# M-right-click so it doesn't open on every drag.
unbind -T root MouseDown3Pane
bind -T root MouseDown3Pane select-pane -t =
bind -T root MouseDrag3Pane copy-mode -M
bind -T copy-mode-vi MouseDrag3Pane select-pane \; send -X rectangle-off \; send -X begin-selection
bind -T copy-mode MouseDrag3Pane select-pane \; send -X rectangle-off \; send -X begin-selection

# Ctrl + either drag selects a rectangle, over mouse-taking apps too (they
# lose Ctrl-click, e.g. nvim's tag jump). The press arms rectangle mode:
# turned on mid-drag, the block's anchor clamps to the line end.
unbind -T root C-MouseDown1Pane
bind -T root C-MouseDown1Pane { select-pane -t = ; copy-mode ; send -X rectangle-on }
bind -T root C-MouseDown3Pane { select-pane -t = ; copy-mode ; send -X rectangle-on }
bind -T root C-MouseDrag1Pane { copy-mode -M ; send -X rectangle-on }
bind -T root C-MouseDrag3Pane { copy-mode -M ; send -X rectangle-on }

bind -T copy-mode-vi C-MouseDrag1Pane select-pane \; send -X rectangle-on \; send -X begin-selection
bind -T copy-mode C-MouseDrag1Pane select-pane \; send -X rectangle-on \; send -X begin-selection
bind -T copy-mode-vi C-MouseDrag3Pane select-pane \; send -X rectangle-on \; send -X begin-selection
bind -T copy-mode C-MouseDrag3Pane select-pane \; send -X rectangle-on \; send -X begin-selection

bind -T copy-mode-vi C-MouseDragEnd1Pane send-keys -X copy-selection
bind -T copy-mode C-MouseDragEnd1Pane send-keys -X copy-selection

# Leave the copy-mode a Ctrl-click entered if it never became a drag
bind -T copy-mode-vi C-MouseUp1Pane if -F "#{!=:#{selection_active},1}" { send -X cancel }
bind -T copy-mode C-MouseUp1Pane if -F "#{!=:#{selection_active},1}" { send -X cancel }
bind -T copy-mode-vi C-MouseUp3Pane if -F "#{!=:#{selection_active},1}" { send -X cancel }
bind -T copy-mode C-MouseUp3Pane if -F "#{!=:#{selection_active},1}" { send -X cancel }

# --- History tracking ---
# Pickers preview by really switching, so they set @picker_busy (in a call of
# its own, as hooks run after their command list) to pause these hooks, and
# record history themselves. Reloading clears it in case a picker died.
set -g @picker_busy 0

# Stamp windows from a global counter for MRU order (window_stack_index puts
# never-selected windows at 0 too). Seed only if unset so reloads don't rewind.
if -F "#{==:#{@mru_seq},}" { set -g @mru_seq 0 }
set-hook -g session-window-changed[44] {
  if -F "#{!=:#{@picker_busy},1}" {
    set -gF @mru_seq "#{e|+|:#{@mru_seq},1}"
    setw -F @mru "#{@mru_seq}"
  }
}

# Last pane across windows and sessions, for prefix-' (the built-in
# last-pane is window-local). Needs focus-events.
set-hook -g pane-focus-in[43] {
  if -F "#{&&:#{!=:#{@picker_busy},1},#{!=:#{pane_id},#{@current-pane}}}" {
    set -gF @last-pane "#{@current-pane}"
    set -gF @current-pane "#{pane_id}"
  }
}

# --- Keybindings: panes ---
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

bind \' run-shell '
  pane="#{@last-pane}"
  { [ -n "$pane" ] &&
    tmux select-pane -t "$pane" &&
    tmux select-window -t "$pane" &&
    tmux switch-client -t "$pane"
  } 2>/dev/null || tmux display-message "no last pane"
'
bind space display-panes -d 0 "swap-pane -dt %%"
bind J join-pane -h -s :+
bind b break-pane -a
# Move this pane to a picked session (new window) or window/pane (split) and
# follow it. run -C expands #{pane_id} before the move.
bind j choose-tree -Zw "run -C \"#{?#{m:*:,%1},break-pane,join-pane -h} -s '#{pane_id}' -t '%1' ; switch-client -t '#{pane_id}'\""

bind -n M-Enter resize-pane -Z

# Toggle pane title bars
bind -n M-t if -F "#{==:#{pane-border-status},off}" \
  "set -w pane-border-status top" \
  "set -w pane-border-status off"

# Send C-h/j/k/l past smart-splits
bind C-h send-keys "C-h"
bind C-j send-keys "C-j"
bind C-k send-keys "C-k"
bind C-l send-keys "C-l"

# --- Keybindings: windows ---
bind c new-window -c "#{pane_current_path}"

bind -n M-1 select-layout even-horizontal
bind -n M-2 select-layout even-vertical
bind -n M-3 select-layout main-horizontal
bind -n M-4 select-layout main-vertical
bind -n M-5 select-layout tiled
bind -n M-, swap-window -t -1 \; previous-window
bind -n M-. swap-window -t +1 \; next-window

# MRU window picker
bind w run-shell "~/.config/tmux/scripts/window-picker.sh"
bind W choose-tree -wZy

# Move this window to a picked session (appended) or after a picked window and
# follow it. Pane picks are cut back to their window for move-window.
bind k choose-tree -Zw "set @move_to '%1' ; run -C \"move-window #{?#{m:*:,%1},,-a} -s '#{window_id}' -t '#{s/%.*//:@move_to}' ; switch-client -t '#{window_id}' ; set -u @move_to\""

# m sends this window (or its stray panes) to its directory's session;
# M gathers this session's panes sharing the current directory
bind m run-shell "~/.config/tmux/scripts/window-sort.sh '#{pane_id}'"
bind M run-shell "~/.config/tmux/scripts/window-sort.sh --session '#{pane_id}'"

# --- Keybindings: sessions ---
bind o run-shell "~/.config/tmux/scripts/session-picker.sh"
bind L run-shell "~/.config/tmux/scripts/session-picker.sh --last"

# --- Keybindings: Claude Code ---
bind . run-shell "~/.config/tmux/scripts/claude-pane.sh '#{pane_current_path}'"
bind > new-window -c "#{pane_current_path}" "fish -lc 'exec claude'"
bind / run-shell "~/.config/tmux/scripts/claude-picker.sh --current --client '#{client_name}'"
bind ? run-shell "~/.config/tmux/scripts/claude-picker.sh --all --client '#{client_name}'"

# --- Popups ---
# In a popup: M-Enter toggles full screen, its own key closes it, another
# popup key switches to that popup
bind -n M-/ run-shell "~/.config/tmux/scripts/popup-toggle.sh -s window"
bind -n M-` run-shell "~/.config/tmux/scripts/popup-toggle.sh -s session"
bind -n M-g run-shell "~/.config/tmux/scripts/popup-toggle.sh -s project -n lazygit lazygit"
bind -n M-m run-shell "~/.config/tmux/scripts/popup-toggle.sh -s server -n btop btop"
bind -n M-n run-shell "~/.config/tmux/scripts/popup-toggle.sh -s server -n nvtop nvtop"
bind -n M-d run-shell "~/.config/tmux/scripts/popup-toggle.sh -s project -n hunk hunk diff"
bind -n M-r run-shell "~/.config/tmux/scripts/popup-toggle.sh -s project -n tuicr tuicr"
# Sync these binds to an already running popup server
run-shell -b "~/.config/tmux/scripts/popup-toggle.sh --mirror"

# Kill popup sessions whose owner pane/window/session is gone
set-hook -g pane-exited[42] 'run-shell "~/.config/tmux/scripts/popup-toggle.sh --gc"'
set-hook -g window-unlinked[42] 'run-shell "~/.config/tmux/scripts/popup-toggle.sh --gc"'
set-hook -g session-closed[42] 'run-shell "~/.config/tmux/scripts/popup-toggle.sh --gc"'

# --- Theme ---
source-file "~/.config/tmux/tmux.theme.conf"

# --- Plugins (TPM) ---
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-sensible"
set -g @plugin "tmux-plugins/tmux-resurrect"
set -g @plugin "tmux-plugins/tmux-continuum"
set -g @plugin "tmux-plugins/tmux-logging"
set -g @plugin "mrjones2014/smart-splits.nvim"

# Bootstrap TPM on first run
if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"

run "~/.config/tmux/plugins/tpm/tpm"
