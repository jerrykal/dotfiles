# Config for the popup tmux server (tmux -L popup), started by
# ~/.tmux/scripts/popup-toggle.sh. Deliberately minimal: no plugins, no theme.

set -g exit-empty off        # keep the server (and its key bindings) alive with zero sessions
set -g status off
set -g escape-time 0
set -g mouse on
set -g detach-on-destroy on  # when the popup's program exits, close the popup
set -g base-index 1
setw -g mode-keys vi
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",${TERM}:Tc"
set -g set-clipboard on
set -g allow-passthrough all
