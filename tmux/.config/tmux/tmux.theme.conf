# --- Palette (Rosé Pine) ---
set -g @rose_pine_base "#191724"
set -g @rose_pine_surface "#1f1d2e"
set -g @rose_pine_overlay "#26233a"
set -g @rose_pine_muted "#6e6a86"
set -g @rose_pine_subtle "#908caa"
set -g @rose_pine_text "#e0def4"
set -g @rose_pine_love "#eb6f92"
set -g @rose_pine_gold "#f6c177"
set -g @rose_pine_rose "#ebbcba"
set -g @rose_pine_pine "#31748f"
set -g @rose_pine_foam "#9ccfd8"
set -g @rose_pine_iris "#c4a7e7"
set -g @rose_pine_hl_low "#21202e"
set -g @rose_pine_hl_med "#403d52"
set -g @rose_pine_hl_high "#524f67"

# --- Messages ---
set -g message-style "fg=#{@rose_pine_text},bg=#{@rose_pine_base},fill=#{@rose_pine_base}"
set -g mode-style "bg=#{@rose_pine_hl_med}"

# --- Copy mode ---
set -g copy-mode-match-style "fg=#{@rose_pine_text},bg=#453935"
set -g copy-mode-current-match-style "fg=#{@rose_pine_base},bg=#{@rose_pine_gold}"
set -g copy-mode-mark-style "fg=#{@rose_pine_base},bg=#{@rose_pine_iris}"
set -g copy-mode-selection-style "bg=#332D41"
set -g copy-mode-position-style "fg=#{@rose_pine_subtle},bg=#{@rose_pine_overlay}"

# --- Menus ---
set -g menu-style "fg=#{@rose_pine_text},bg=#{@rose_pine_base}"
set -g menu-selected-style "fg=#{@rose_pine_text},bg=#{@rose_pine_hl_med}"
set -g menu-border-style "fg=#{@rose_pine_hl_high},bg=#{@rose_pine_base}"
set -g menu-border-lines single

# --- Panes & popups ---
# Explicit bg keeps tmux opaque under the terminal's background-opacity
set -g window-style "bg=#{@rose_pine_base}"
set -g pane-border-status "top"
set -g pane-border-lines "single"
set -g pane-border-format " #{pane_title} "
set -g pane-border-style "fg=#{@rose_pine_hl_high},bg=#{@rose_pine_base}"
set -g pane-active-border-style "fg=#{@rose_pine_hl_high},bg=#{@rose_pine_base}"
set -g display-panes-colour "#6e6a86" # @rose_pine_muted
set -g display-panes-active-colour "#f6c177" # @rose_pine_gold
set -g popup-style "bg=#{@rose_pine_base}"
set -g popup-border-style "fg=#{@rose_pine_hl_high},bg=#{@rose_pine_base}"

# --- Status bar ---
set -g status-interval 5
set -g status-position bottom
set -g status-style "fg=#{@rose_pine_hl_high},bg=#{@rose_pine_base}"
set -g status-justify left

# Left: prefix indicator + session name
set -g status-left-length 100
set -g status-left "#{?client_prefix,#[fg=#{@rose_pine_iris}]⎸#[fg=default], }#S   "

# Right: current path (shortened when it overflows 40% of window width) + user@host
%hidden TMUX_PANE_HOME_SHORTENED_PATH="#{s|\\$HOME|~|:pane_current_path}" # replace $HOME with ~ in current_path
%hidden PANE_ALL_SHORTENED_PATH="#{s|(/.)[^/]*|\\1|:$TMUX_PANE_HOME_SHORTENED_PATH}" # transform [~]/aaa/bbbb/ccc to [~]/a/b/c
%hidden PANE_CUR_DIR="#{b:pane_current_path}" # get current directory name (e.g. ccc)
%hidden PANE_SHORTENED_PATH="#{s|/[^/]*$|/$PANE_CUR_DIR|:$PANE_ALL_SHORTENED_PATH}" # transform [~]/a/b/c to [~]/a/b/ccc
%hidden PATH_LEN="#(tmux display-message -p '#{T:TMUX_PANE_HOME_SHORTENED_PATH}' |wc -c)" # get number of characters in path
%hidden PATH_OVERFLOW="#{e|>:$PATH_LEN,#{e|*|f:#{window_width},0.4}}" # check if path len is > 0.4*{window_width}

set -g status-right-length 150
set -g status-right "#{?$PATH_OVERFLOW,$PANE_SHORTENED_PATH,$TMUX_PANE_HOME_SHORTENED_PATH}  #(command -v whoami > /dev/null && whoami)@#H "

# --- Window status ---
%hidden PANE_COUNT_SUP="#{?#{e|>:#{window_panes},1},#{s|0|⁰|;s|1|¹|;s|2|²|;s|3|³|;s|4|⁴|;s|5|⁵|;s|6|⁶|;s|7|⁷|;s|8|⁸|;s|9|⁹|:window_panes},}" # pane count as superscript, hidden for single-pane windows

set -g window-status-bell-style "fg=#{@rose_pine_love}"
set -g window-status-activity-style "fg=#{@rose_pine_gold}"
%hidden WINDOW_SEP="#{?window_start_flag,,#[fg=#{@rose_pine_hl_high}]· #[default]}" # dot separator, omitted for the first window; fg pinned so bell/activity styles don't recolor it

set -g window-status-format "$WINDOW_SEP#W$PANE_COUNT_SUP#{?window_zoomed_flag, 󰊓,}"
set -g window-status-current-format "$WINDOW_SEP#[fg=#{@rose_pine_text}]#W$PANE_COUNT_SUP#{?window_zoomed_flag, #[fg=#{@rose_pine_foam}]󰊓,}"
