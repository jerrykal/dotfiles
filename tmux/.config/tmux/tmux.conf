# --- General ---
# set prefix to ctrl+space
unbind C-b
set-option -g prefix C-Space
bind C-Space send-prefix

# Enable mouse support
set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows on window close
set -g renumber-windows on

# When the current session is destroyed, the client is detached iff there are no detached session
set -g detach-on-destroy no-detached

# Allow passthrough for OSC52 clipboard sequences
set -g set-clipboard on
set -g allow-passthrough all

# Enable extended keys support
set -g extended-keys on
set -g extended-keys-format csi-u

set -g focus-events on

# --- Terminal & display ---
# Setup true-colors
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",${TERM}:Tc"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0

# Blinking block cursor (tmux 3.5+)
set -g cursor-style blinking-block

# Set terminal title to session name
set -g set-titles on
set -g set-titles-string "#S — #W  [#(command -v whoami > /dev/null && whoami)@#H]"

# Set main-pane height and width
set -g main-pane-height 75%
set -g main-pane-width 70%

# --- Copy mode ---
# Vim copy mode
setw -g mode-keys vi
bind P paste-buffer
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle \; send-keys -X begin-selection

# Vim-like incremental search (n/N repeat as usual)
bind -T copy-mode-vi / command-prompt -i -p "/" "send-keys -X search-forward-incremental \"%%%\""
bind -T copy-mode-vi ? command-prompt -i -p "?" "send-keys -X search-backward-incremental \"%%%\""

# Smoother mouse scroll
bind -T copy-mode-vi WheelUpPane send -N 1 -X scroll-up
bind -T copy-mode-vi WheelDownPane send -N 1 -X scroll-down
bind -T copy-mode WheelUpPane send -N 1 -X scroll-up
bind -T copy-mode WheelDownPane send -N 1 -X scroll-down

# Do not exit copy-mode after mouse selection
unbind -T copy-mode-vi MouseDragEnd1Pane
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection
unbind -T copy-mode MouseDragEnd1Pane
bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-selection

# --- Keybindings ---
# Pane
# Jump to the last active pane, even across windows and sessions (the built-in
# last-pane is window-local). pane-focus-in fires whenever the attached
# client's active pane changes (needs focus-events on).
set-hook -g pane-focus-in[43] {
  if -F "#{!=:#{pane_id},#{@current-pane}}" {
    set -gF @last-pane "#{@current-pane}"
    set -gF @current-pane "#{pane_id}"
  }
}
bind \' run-shell '
  pane="#{@last-pane}"
  { [ -n "$pane" ] &&
    tmux select-pane -t "$pane" &&
    tmux select-window -t "$pane" &&
    tmux switch-client -t "$pane"
  } 2>/dev/null || tmux display-message "no last pane"
'
bind x kill-pane
bind space display-panes -d 0 "swap-pane -dt %%"
bind J join-pane -h -s :+
bind b break-pane -a

# Restore ctrl+h/j/k/l keys (taken by smart-splits) by pressing the prefix key first
bind C-h send-keys "C-h"
bind C-j send-keys "C-j"
bind C-k send-keys "C-k"
bind C-l send-keys "C-l"

# Window
bind -n M-1 select-layout even-horizontal
bind -n M-2 select-layout even-vertical
bind -n M-3 select-layout main-horizontal
bind -n M-4 select-layout main-vertical
bind -n M-5 select-layout tiled
bind -n M-, swap-window -t -1 \; previous-window
bind -n M-. swap-window -t +1 \; next-window
bind w choose-tree -wZy
bind c new-window -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# Session
bind o run-shell "~/.tmux/scripts/session-picker.sh"

# Claude Code
bind . run-shell "~/.tmux/scripts/claude-pane.sh '#{pane_current_path}'"
bind > new-window -c "#{pane_current_path}" "fish -lc 'exec claude'"
bind / run-shell "~/.tmux/scripts/claude-picker.sh --current"
bind ? run-shell "~/.tmux/scripts/claude-picker.sh --all"

# --- Popups ---
bind -n M-s run-shell "~/.tmux/scripts/popup-toggle.sh -s session -k M-s"
bind -n M-g run-shell "~/.tmux/scripts/popup-toggle.sh -s cwd -n lazygit -k M-g lazygit"
bind -n M-m run-shell "~/.tmux/scripts/popup-toggle.sh -s server -n btop -k M-m btop"
bind -n M-n run-shell "~/.tmux/scripts/popup-toggle.sh -s server -n nvtop -k M-n nvtop"

# Kill popup sessions whose owner pane/window/session is gone
set-hook -g pane-exited[42] 'run-shell "~/.tmux/scripts/popup-toggle.sh --gc"'
set-hook -g window-unlinked[42] 'run-shell "~/.tmux/scripts/popup-toggle.sh --gc"'
set-hook -g session-closed[42] 'run-shell "~/.tmux/scripts/popup-toggle.sh --gc"'

# --- Theme ---
source-file "~/.config/tmux/tmux.theme.conf"

# --- Plugins (TPM) ---
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-sensible"
set -g @plugin "tmux-plugins/tmux-resurrect"
set -g @plugin "tmux-plugins/tmux-continuum"
set -g @plugin "tmux-plugins/tmux-logging"
set -g @plugin "mrjones2014/smart-splits.nvim"

# Bootstrap TPM on first run
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

run "~/.tmux/plugins/tpm/tpm"
