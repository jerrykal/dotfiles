# Loaded on macOS only (auto_env = true in .miserc.toml).

[dotfiles]
"~/.config/ghostty" = "ghostty"
"~/.config/karabiner" = { source = "karabiner", mode = "symlink-each", manifest = "git" }

# macOS defaults
[bootstrap.macos.keyboard]
key_repeat = 2
initial_key_repeat = 15
press_and_hold = false

[bootstrap.macos.dock]
autohide = true
mru_spaces = false
show_recents = false

[bootstrap.macos.finder]
preferred_view_style = "list"
show_all_files = true
show_pathbar = true
show_status_bar = true

[bootstrap.macos.defaults]
"com.apple.dock" = { autohide-delay = 0.0, autohide-time-modifier = 0.3, size-immutable = true }

# Dock only picks up changed defaults after a relaunch
[bootstrap.hooks.post-defaults]
run = "killall Dock || true"

# GUI apps installed as Homebrew casks
[bootstrap.packages]
"brew-cask:1password" = "latest"
"brew-cask:alt-tab" = "latest"
"brew-cask:betterdisplay" = "latest"
"brew-cask:claude" = "latest"
"brew-cask:discord" = "latest"
"brew-cask:drawio" = "latest"
"brew-cask:font-jetbrains-mono-nerd-font" = "latest"
"brew-cask:ghostty" = "latest"
"brew-cask:google-drive" = "latest"
"brew-cask:helium-browser" = "latest"
