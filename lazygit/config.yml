git:
  diffRenderers:
    - colorArg: always
      command: delta --paging=never
os:
  editPreset: nvim
  copyToClipboardCmd: >
    if [[ "$TERM" =~ ^(screen|tmux) ]]; then
      printf "\033Ptmux;\033\033]52;c;$(printf {{text}} | base64 -w 0)\a\033\\" > /dev/tty
    else
      printf "\033]52;c;$(printf {{text}} | base64 -w 0)\a" > /dev/tty
    fi
update:
  method: never
promptToReturnFromSubprocess: false
keybinding:
  files:
    commitChangesWithEditor: <disabled>
customCommands:
  - key: C
    context: files
    description: commit with Claude-written message (commit)
    command: clear && commit
    output: terminal
  - key: H
    context: files
    description: review working tree in hunk
    command: clear && hunk diff
    output: terminal
  - key: H
    context: commits
    description: review commit in hunk
    command: clear && hunk show {{.SelectedLocalCommit.Sha}}
    output: terminal
  - key: H
    context: stash
    description: review stash in hunk
    command: clear && hunk stash show {{.SelectedStashEntry.RefName}}
    output: terminal
gui:
  nerdFontsVersion: "3"
  border: single
  showDivergenceFromBaseBranch: arrowAndNumber
  showNumstatInFilesView: true
  expandFocusedSidePanel: true
  skipDiscardChangeWarning: true
  theme:
    activeBorderColor:
      - "#31748f"
      - bold
    inactiveBorderColor:
      - "#524f67"
    searchingActiveBorderColor:
      - "#ebbcba"
      - bold
    optionsTextColor:
      - "#9ccfd8"
    selectedLineBgColor:
      - "#26233a"
    inactiveViewSelectedLineBgColor:
      - "#26233a"
      - bold
    cherryPickedCommitFgColor:
      - "#1f1d2e"
    cherryPickedCommitBgColor:
      - "#ebbcba"
    markedBaseCommitFgColor:
      - "#9ccfd8"
    markedBaseCommitBgColor:
      - "#f6c177"
    unstagedChangesColor:
      - "#eb6f92"
    defaultFgColor:
      - "#e0def4"
